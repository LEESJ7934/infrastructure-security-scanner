name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-reporting-test.txt
      - name: Install runtime and reporting test dependencies
        run: python -m pip install -r requirements.txt -r requirements-reporting-test.txt
      - name: Install Korean PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q asset_management scanner db scripts analysis verification api cloud_security config_audit tests

  secrets:
    # Independent of test/compile results: never suppress this check after a failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_secrets.py
