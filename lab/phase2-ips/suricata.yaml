%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[10.207.0.0/16]"
    EXTERNAL_NET: "any"
  port-groups:
    HTTP_PORTS: "8080"
classification-file: /opt/ips/classification.config
reference-config-file: /opt/ips/reference.config
default-log-dir: /tmp
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: no
            packet: no
        - drop:
            alerts: yes
        - http
        - flow
        - stats
  - fast:
      enabled: no
logging:
  default-log-level: notice
  outputs:
    - file:
        enabled: yes
        filename: suricata.log
stream:
  inline: yes
  checksum-validation: no
  memcap: 32mb
  reassembly:
    memcap: 32mb
flow:
  memcap: 16mb
host:
  memcap: 8mb
defrag:
  memcap: 8mb
app-layer:
  protocols:
    http:
      enabled: yes
threading:
  set-cpu-affinity: no
stats:
  enabled: yes
  interval: 1
unix-command:
  enabled: no
