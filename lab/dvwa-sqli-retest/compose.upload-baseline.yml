name: scanner-dvwa-upload-baseline

services:
  web:
    image: ghcr.io/digininja/dvwa:068d974@sha256:1af2cedda7617e4d22937e61c98bbf71d8b74b98e46f5e41dd6aa0a5183311b0
    environment:
      DB_SERVER: db
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: "${DVWA_UPLOAD_BASELINE_DB_PASSWORD:?Set a baseline-only database password}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4282:80"

  db:
    image: mariadb:10.11.10@sha256:41d89394db8e777d96058d4cf5cf4daf1ed87f76192154f3d89572676f1e2327
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: dvwa
      MARIADB_USER: dvwa
      MARIADB_PASSWORD: "${DVWA_UPLOAD_BASELINE_DB_PASSWORD:?Set a baseline-only database password}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    tmpfs:
      - /var/lib/mysql
