name: scanner-dvwa-sqli-retest

services:
  web:
    build: .
    environment:
      DB_SERVER: db
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: "${DVWA_RETEST_DB_PASSWORD:?Set DVWA_RETEST_DB_PASSWORD for the copy}"
      SQLI_DB: mysql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4281:80"
    volumes:
      - uploads:/var/lib/dvwa-uploads

  db:
    image: mariadb:10.11.10@sha256:41d89394db8e777d96058d4cf5cf4daf1ed87f76192154f3d89572676f1e2327
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: dvwa
      MARIADB_USER: dvwa
      MARIADB_PASSWORD: "${DVWA_RETEST_DB_PASSWORD:?Set DVWA_RETEST_DB_PASSWORD for the copy}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - data:/var/lib/mysql

volumes:
  data:
  uploads:
