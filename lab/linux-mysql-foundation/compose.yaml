name: scanner-day2

services:
  ubuntu:
    build:
      context: ./ubuntu
    networks:
      - day2

  mysql:
    image: mysql:8.0
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - day2
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_ROOT_PASSWORD"
          mysql --protocol=TCP --host=127.0.0.1 --user=root --batch
          --execute='SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  day2:
    internal: true

volumes:
  mysql-data:
